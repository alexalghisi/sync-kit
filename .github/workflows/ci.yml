name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: synckit
                    POSTGRES_PASSWORD: synckit
                    POSTGRES_DB: synckit
                ports: ["5432:5432"]
                options: --health-cmd="pg_isready -U synckit" --health-interval=5s --health-retries=10
        env:
            SYNC_KIT_TEST_DATABASE_URL: postgres://synckit:synckit@localhost:5432/synckit
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: node dist/src/cli.js dry-run tasks
